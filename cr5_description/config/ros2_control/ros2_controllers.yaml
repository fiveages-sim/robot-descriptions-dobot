# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    gripper_controller:
      type: adaptive_gripper_controller/AdaptiveGripperController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ocs2_arm_controller:
      type: ocs2_arm_controller/Ocs2ArmController


arm_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

gripper_controller:
  ros__parameters:
    joint: gripper_joint
    force_feedback_ratio: 0.1
    force_threshold: 0.01

ocs2_arm_controller:
  ros__parameters:
    # Joint configuration
    update_rate: 100  # Hz
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    command_interfaces:
      - position
    state_interfaces:
      - position

    robot_name: cr5

    # Future time offset for trajectory prediction (in seconds)
    future_time_offset: 1.0
    movel_duration: 0.5
    movel_sample_interval: 0.04
    movel_max_linear_velocity: 0.3
    movel_max_linear_acceleration: 1.0
    movel_max_linear_jerk: 2.0
    movel_max_angular_velocity: 1.0
    movel_max_angular_acceleration: 2.0
    movel_max_angular_jerk: 4.0
    movel_auto_extend_duration: true
    movej_interpolation_type: doubles
    home_interpolation_type: doubles

    # Control parameters
    home_1: [3.14, 0.0, -1.57, 0.0, 1.57, 0.0]